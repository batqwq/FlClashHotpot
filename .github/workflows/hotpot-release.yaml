name: Hotpot Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'README_zh_CN.md'
      - '.github/workflows/sync-upstream.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  release-android:
    name: Build and Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            core/go.sum
            android/core/build.gradle.kts

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-apk
          workspaces: |
            plugins/rust_api/rust
            android/vpnhotspot/src/main/rust/vpnhotspotd
          cache-directories: .dart_tool/hooks_runner
          save-if: true

      - name: Setup Rust Android targets
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Android Signing
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Pre-download Go modules
        working-directory: core
        run: go mod download

      - name: Build Android arm64 APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Prepare release metadata
        id: meta
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          TAG="v${VERSION}-hotpot.${GITHUB_RUN_NUMBER}"
          APK_OUT="build/app/outputs/flutter-apk/FlClashHotpot-${VERSION}-hotpot.${GITHUB_RUN_NUMBER}-android-arm64.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$APK_OUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_OUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: FlClashHotpot ${{ steps.meta.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: ${{ steps.meta.outputs.apk }}
